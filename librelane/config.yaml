# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy']
SYNTH_HIERARCHY_MODE: deferred_flatten
# SYNTH_HIERARCHY_MODE: keep
SYNTH_WRITE_NOATTR: false
# SYNTH_AUTONAME: True


# Magic, thank you Lofty
SYNTH_STRATEGY: "AREA 3"
SYNTH_SIZING: True
SYNTH_ABC_BUFFERING: True

# default: 10
MAX_FANOUT_CONSTRAINT: 15



# Slightly smaller file sizes
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# SDC files
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc
FALLBACK_SDC: dir::chip_top.sdc

# DFT
DFT_TEST_MODE_WIRE: tm_PAD2CORE
DFT_TEST_CLOCK_WIRE: clk_PAD2CORE
DFT_SCAN_IN_PATTERN: sci_pad/Y
DFT_SCAN_OUT_PATTERN: sco_pad/A
DFT_SCAN_ENABLE_PATTERN: sce_pad/Y
DFT_JSON_MAPPING: dir::gf180_mapping.json
DFT_BSCAN_EXCLUDE_IO:
  - clk_PAD
  - tm_PAD
  - rst_n_PAD
  - sce_PAD
  - sci_PAD
  - sco_PAD

# Power / ground nets
VDD_NETS:
- VDD
GND_NETS:
- VSS

# We need to add gf180mcu_fd_io__bi_24t
# due to the unused Y output for output only pads
IGNORE_DISCONNECTED_MODULES:
- gf180mcu_fd_io__bi_24t
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo
- gf180mcu_gsd__logo

# Clock
CLOCK_PORT: clk_PAD
CLOCK_NET: clk_pad/Y
CLOCK_PERIOD: 100 # 10 MHz

PL_RESIZER_SETUP_SLACK_MARGIN: 0.02
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.02

# Fix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1

# Slightly better timing vs runtime
RUN_POST_GRT_RESIZER_TIMING: True
RUN_POST_GRT_DESIGN_REPAIR: True

# Increase for more logic
# on your die
PL_TARGET_DENSITY_PCT: 50
GRT_ALLOW_CONGESTION: True

# Fix antenna violations after DRT
DRT_ANTENNA_REPAIR_ITERS: 5
DRT_ANTENNA_MARGIN: 5 # %

DESIGN_REPAIR_MAX_SLEW_PCT: 5
DESIGN_REPAIR_MAX_CAP_PCT: 5
DESIGN_REPAIR_REMOVE_BUFFERS: True

# PDN - Straps
PDN_VWIDTH: 6
PDN_HWIDTH: 6
PDN_VSPACING: 1
PDN_HSPACING: 1
PDN_VPITCH: 100
PDN_HPITCH: 100

# PDN - Core ring
PDN_CORE_RING: True
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 20
PDN_CORE_RING_HWIDTH: 20
PDN_CORE_RING_CONNECT_TO_PADS: True
PDN_ENABLE_PINS: False
PDN_CORE_VERTICAL_LAYER: Metal2
PDN_CORE_HORIZONTAL_LAYER: Metal3

# Due to OpenROAD bug
# https://github.com/The-OpenROAD-Project/OpenROAD/issues/8229
#PL_TIME_DRIVEN: False
#PL_ROUTABILITY_DRIVEN: False

# Prevent false positive DRC errors in I/O cells
MAGIC_GDS_FLATGLOB:
# For contacts
- "*_CDNS_*"
# Foundry provided SRAMs
- "*$$*"
- "M1_N*"
- "M1_P*"
- "M2_M1*"
- "M3_M2*"
- "nmos_5p0*"
- "nmos_1p2*"
- "pmos_5p0*"
- "pmos_1p2*"
- "via1_*"
- "ypass_gate*"
- "G_ring_*"
# These additional cells must be flattened to get rid of 3.3V devices
# (DUALGATE drawn into high-level cells)
- "dcap_103*"
- "din_*"
- "mux821_*"
- "rdummy_*"
- "pmoscap_*"
- "xdec_*"
- "ypredec*"
- "xpredec*"
- "prexdec_*"
- "xdec8_*"
- "xdec16_*"
- "xdec32_*"
- "sa_*"

# Since we cannot meet the minimum density limit on Metal2,
# move the dummy shapes to the active metal layer and ignore
# DM.5_DM.7 and DM.4_DM.6
KLAYOUT_FILLER_OPTIONS:
  Metal2_active: true

# Because we have multiple power pads for one power domain
MAGIC_EXT_UNIQUE: notopports

MACROS:
  gf180mcu_ws_ip__id:
    gds:
      - dir::../ip/gf180mcu_ws_ip__id/gds/gf180mcu_ws_ip__id.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__id/lef/gf180mcu_ws_ip__id.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__id/vh/gf180mcu_ws_ip__id.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__id/lib/gf180mcu_ws_ip__id.lib
    instances:
      chip_id:
        location: [26, 26]
        orientation: N

  gf180mcu_ws_ip__logo:
    gds:
      - dir::../ip/gf180mcu_ws_ip__logo/gds/gf180mcu_ws_ip__logo.gds
    lef:
      - dir::../ip/gf180mcu_ws_ip__logo/lef/gf180mcu_ws_ip__logo.lef
    vh:
      - dir::../ip/gf180mcu_ws_ip__logo/vh/gf180mcu_ws_ip__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_ws_ip__logo/lib/gf180mcu_ws_ip__logo.lib
    instances:
      wafer_space_logo:
        location: ["expr::$DIE_AREA[2] + -169.25", "expr::$DIE_AREA[3] + -169.25"]
        orientation: N
  
  gf180mcu_gsd__logo:
    gds:
      - dir::../ip/gf180mcu_gsd__logo/gds/gf180mcu_gsd__logo.gds
    lef:
      - dir::../ip/gf180mcu_gsd__logo/lef/gf180mcu_gsd__logo.lef
    vh:
      - dir::../ip/gf180mcu_gsd__logo/vh/gf180mcu_gsd__logo.v
    lib:
      "*":
        - dir::../ip/gf180mcu_gsd__logo/lib/gf180mcu_gsd__logo.lib
    instances:
      gsd_logo:
        location: [26, "expr::$DIE_AREA[3] + -188"]
        orientation: N

  gf180mcu_fd_ip_sram__sram512x8m8wm1:
    gds:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/gds/gf180mcu_fd_ip_sram__sram512x8m8wm1.gds
    lef:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lef/gf180mcu_fd_ip_sram__sram512x8m8wm1.lef
    vh:
      - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/verilog/gf180mcu_fd_ip_sram__sram512x8m8wm1__blackbox.v
    lib:
      "*_tt_025C_5v00":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__tt_025C_5v00.lib
      "*_ff_n40C_5v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ff_n40C_5v50.lib
      "*_ss_125C_4v50":
        - pdk_dir::libs.ref/gf180mcu_fd_ip_sram/lib/gf180mcu_fd_ip_sram__sram512x8m8wm1__ss_125C_4v50.lib
    instances:
      # SRAM cells 
      u_chip_core.gen_proc_wrapper[0].u_proc_wrapper.u_sram:
        location: ["expr::2800", "expr::549.11 + 0*500"]
        orientation: W
      u_chip_core.gen_proc_wrapper[1].u_proc_wrapper.u_sram:
        location: ["expr::2800", "expr::549.11 + 1*500"]
        orientation: W
      u_chip_core.gen_proc_wrapper[2].u_proc_wrapper.u_sram:
        location: ["expr::2800", "expr::549.11 + 2*500"]
        orientation: W

      u_chip_core.gen_proc_wrapper[3].u_proc_wrapper.u_sram:
        location: ["expr::800", "expr::549.11 + 0*500"]
        orientation: E
      u_chip_core.gen_proc_wrapper[4].u_proc_wrapper.u_sram:
        location: ["expr::800", "expr::549.11 + 1*500"]
        orientation: E
      u_chip_core.gen_proc_wrapper[5].u_proc_wrapper.u_sram:
        location: ["expr::800", "expr::549.11 + 2*500"]
        orientation: E


      u_chip_core.gen_proc_wrapper[6].u_proc_wrapper.u_sram:
        location: ["expr::1800", "expr::549.11 + 0*500"]
        orientation: E
      u_chip_core.gen_proc_wrapper[7].u_proc_wrapper.u_sram:
        location: ["expr::1800", "expr::549.11 + 2*500"]
        orientation: W




# This is an alternative method compared to
# specifying the power connections in the RTL
PDN_MACRO_CONNECTIONS:
 - ".*u_sram VDD VSS VDD VSS"

# Halo size around macros while cutting rows.
# Workaround for: https://github.com/The-OpenROAD-Project/OpenROAD/issues/8868
FP_MACRO_HORIZONTAL_HALO: 6
FP_MACRO_VERTICAL_HALO: 6
FP_PDN_HORIZONTAL_HALO: 4
FP_PDN_VERTICAL_HALO: 4

PDN_CFG: dir::pdn_cfg.tcl

# Make sure netgen doesn't create 'no_connect' nets
# Not needed since netgen 1.5.303
LVS_FLATTEN_CELLS:
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo
- gf180mcu_gsd__logo

# gf180mcu_ws_ip__id/logo has no ports and components
# therefore make it an abstract cell in the layout
MAGIC_EXT_ABSTRACT_CELLS:
- gf180mcu_ws_ip__id
- gf180mcu_ws_ip__logo
- gf180mcu_gsd__logo
